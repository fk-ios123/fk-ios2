name: fk-ios-random

services:
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy:/etc/caddy:ro,z
      - ./index.html:/srv/index.html:ro,z
      - ./data:/config-data:ro,z
      - caddy_data:/data
      - caddy_config:/config

  bot:
    build: ./bot
    restart: unless-stopped
    profiles: [bot]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-7330051588}
    volumes:
      - ./data:/data:z
      - bot_session:/state

volumes:
  caddy_data:
  caddy_config:
  bot_session:
