name: fk-ios-random

services:
  web:
    image: docker.io/library/nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./index.html:/usr/share/nginx/html/index.html:ro,z
      - ./data:/config-data:ro,z

  bot:
    build: ./bot
    restart: unless-stopped
    profiles: [bot]
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-2496}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-8da85b0d5bfe62527e5b244c209159c3}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8681575972:AAHM-hvXS1LiJvkQSlF37uPwHKW6eb5Xm9I}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-7330051588}
    volumes:
      - ./data:/data:z
      - bot_session:/state

volumes:
  bot_session:
