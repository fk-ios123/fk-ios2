x-site: &site
  image: nginx:stable-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 5s

services:
  mbhhrx:
    <<: *site
    ports:
      - "${MBHHRX_PORT:-8082}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mbhhrx.elm-ec.com:/usr/share/nginx/html:ro
      - ./libs/JJ/assets/js:/shared/assets/js:ro
      - ./libs/JJ/front_asset_map.json:/shared/front_asset_map.json:ro

  rbouzb:
    <<: *site
